name: Image

# Образ в GHCR на каждый пуш в main и dev. Имя то же, что было у образов из монорепо
# (ghcr.io/<владелец>/food-delivery-payment-service), поэтому docker-compose платформы не меняется.
on:
  push:
    branches: [main, dev]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # settings.xml с токеном, который setup-java положил в ~/.m2, уходит в сборку секретом
      # BuildKit: в слои образа он не попадает.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Имя образа
        id: name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/food-delivery-payment-service" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          context: .
          push: true
          secret-files: |
            maven_settings=${{ runner.temp }}/../.m2/settings.xml
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
