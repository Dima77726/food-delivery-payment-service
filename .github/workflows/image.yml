name: Image

# Образ в GHCR на каждый пуш в main и dev. Имя то же, что было у образов из монорепо
# (ghcr.io/<владелец>/food-delivery-payment-service), поэтому docker-compose платформы не меняется.
on:
  push:
    branches: [main, dev]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # settings.xml, который пишет setup-java, для этого не годится: пароль в нём — ссылка
      # ${env.GITHUB_TOKEN}, а внутри docker build такой переменной нет, и Maven получил бы 401.
      # Поэтому файл пишется сам, с настоящим значением токена. Уходит он в сборку секретом
      # BuildKit (см. Dockerfile): в слои образа не попадает. Токен маскируется в логах.
      - name: settings.xml для сборки образа
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/maven-settings.xml" <<SETTINGS
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Имя образа
        id: name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/food-delivery-payment-service" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          secret-files: |
            maven_settings=${{ runner.temp }}/maven-settings.xml
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
