spring:
  application:
    name: payment-service

  lifecycle:
    # Согласовано с stop_grace_period в docker-compose.yml.
    timeout-per-shutdown-phase: 20s

  datasource:
    # Своя база платежей (database-per-service). Деньги — здесь и только здесь.
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5432}/${PAYMENT_DB_NAME:payments}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      leak-detection-threshold: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Схемой владеет Liquibase. validate сверяет сущности с таблицами и падает при расхождении.
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:/db/changelog/changelog.yml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

    template:
      # Отправка и получение сообщений становятся спанами, а traceparent едет заголовком
      # сообщения: трассу можно проследить из одного сервиса в другой через Kafka.
      observation-enabled: true

    producer:
      # Потерянный исход платежа — это деньги, списанные за заказ, который об этом не узнал.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    consumer:
      # Команды читает только сервис платежей.
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}
      auto-offset-reset: earliest
      properties:
        max.poll.records: 50

    listener:
      ack-mode: record
      observation-enabled: true

app:
  outbox:
    publish-interval: ${OUTBOX_PUBLISH_INTERVAL:PT2S}
    publish-enabled: ${OUTBOX_PUBLISH_ENABLED:true}

  security:
    jwt:
      issuer: ${JWT_ISSUER:food-delivery-platform}
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8085/.well-known/jwks.json}

management:
  # Трассировка. Спаны собирает Micrometer Tracing поверх OpenTelemetry и отправляет по OTLP
  # в Tempo. Сквозной идентификатор trace живёт рядом с X-Correlation-Id, а не вместо него:
  # метка запроса — наша, она едет и через то, что трассировка не покрывает (outbox, очереди).
  tracing:
    sampling:
      # В локальном стеке — все запросы. В боевом этого слишком много: 0.1 и ниже.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
  otlp:
    tracing:
      export:
        # Выключено по умолчанию: запуск из IDE и тесты не должны сыпать в лог ошибками
        # о недоступном Tempo. Docker Compose включает через TRACING_EXPORT_ENABLED=true.
        enabled: ${TRACING_EXPORT_ENABLED:false}
    metrics:
      export:
        # Метрики по-прежнему снимает Prometheus; стартер тянет OTLP-реестр метрик,
        # и без этой строки он слал бы то же самое второй раз.
        enabled: false
  server:
    port: ${MANAGEMENT_PORT:9087}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-},%X{userId:-}] "
  level:
    root: INFO
    com.dima.fooddelivery: DEBUG
